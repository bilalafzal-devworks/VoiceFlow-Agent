<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="1600" height="1020">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;text-anchor:middle}
.h{font-size:28px;font-weight:700;fill:#1c1c28}.t{font-size:19px;font-weight:700;fill:#1c1c28}
.s{font-size:14px;fill:#555}.l{font-size:14px;font-style:italic;fill:#333}
.g{font-size:17px;font-weight:700;fill:#2E7D32;text-anchor:start}.lg{font-size:14px;fill:#333;text-anchor:start}</style>
<rect width="1600" height="1020" fill="#ffffff"/>
<text x="800" y="44" class="h">VoiceFlow Agent: end-to-end pipeline</text><rect x="40" y="80" width="220" height="80" rx="12" fill="#E6F0FF" stroke="#2F6FD6" stroke-width="2.5"/><text x="150.0" y="114.0" class="t">1. Voice input</text><text x="150.0" y="136.0" class="s">Streamlit audio_input</text><rect x="330" y="80" width="220" height="80" rx="12" fill="#E6F0FF" stroke="#2F6FD6" stroke-width="2.5"/><text x="440.0" y="114.0" class="t">2. Speech to text</text><text x="440.0" y="136.0" class="s">Groq Whisper large-v3</text><rect x="620" y="80" width="220" height="80" rx="12" fill="#E6F0FF" stroke="#2F6FD6" stroke-width="2.5"/><text x="730.0" y="114.0" class="t">3. Editable transcript</text><text x="730.0" y="136.0" class="s">fix mishearings</text><rect x="910" y="80" width="220" height="80" rx="12" fill="#EFE8FF" stroke="#6B46D6" stroke-width="2.5"/><text x="1020.0" y="114.0" class="t">4. Router Agent</text><text x="1020.0" y="136.0" class="s">JSON intent + query</text><path d="M260,120 L330,120" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><path d="M550,120 L620,120" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><path d="M840,120 L910,120" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="270" width="260" height="80" rx="12" fill="#E2F6F1" stroke="#12917A" stroke-width="2.5"/><text x="170.0" y="304.0" class="t">Knowledge base</text><text x="170.0" y="326.0" class="s">chunks + page metadata</text><rect x="420" y="270" width="240" height="80" rx="12" fill="#EFE8FF" stroke="#6B46D6" stroke-width="2.5"/><text x="540.0" y="304.0" class="t">5a. Retriever Agent</text><text x="540.0" y="326.0" class="s">judges: sufficient?</text><rect x="900" y="270" width="240" height="80" rx="12" fill="#E2F6F1" stroke="#12917A" stroke-width="2.5"/><text x="1020.0" y="304.0" class="t">5b. Researcher Agent</text><text x="1020.0" y="326.0" class="s">DuckDuckGo / Wikipedia</text><path d="M300,310 L420,310" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="360" y="296" class="l">BM25 + rerank</text><path d="M1020,160 L1020,270" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="1075" y="236" class="l">web_lookup</text><path d="M1020,205 L540,205 L540,270" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="700" y="196" class="l">knowledge_question</text><path d="M660,310 L900,310" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="780" y="300" class="l">not sufficient</text><rect x="420" y="470" width="240" height="80" rx="12" fill="#EFE8FF" stroke="#6B46D6" stroke-width="2.5"/><text x="540.0" y="504.0" class="t">6. Writer Agent</text><text x="540.0" y="526.0" class="s">cited answer / document</text><rect x="790" y="470" width="240" height="80" rx="12" fill="#EFE8FF" stroke="#6B46D6" stroke-width="2.5"/><text x="910.0" y="504.0" class="t">7. Reviewer Agent</text><text x="910.0" y="526.0" class="s">citations + groundedness</text><rect x="1120" y="470" width="220" height="80" rx="12" fill="#E6F0FF" stroke="#2F6FD6" stroke-width="2.5"/><text x="1230.0" y="504.0" class="t">Answer + sources</text><text x="1230.0" y="526.0" class="s">shown in the UI</text><path d="M540,350 L540,470" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="552" y="415" class="l">sufficient</text><path d="M1020,350 L1020,420 L620,420 L620,470" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="860" y="412" class="l">evidence S1, S2, ...</text><path d="M660,510 L790,510" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="725" y="500" class="l">draft</text><path d="M910,550 L910,605 L540,605 L540,550" fill="none" stroke="#6B46D6" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="725" y="597" class="l">revise (max 2x)</text><path d="M1030,510 L1120,510" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="1075" y="498" class="l">approved</text><rect x="40" y="470" width="260" height="80" rx="12" fill="#F1F1F1" stroke="#888888" stroke-width="2.5"/><text x="170.0" y="504.0" class="t">Guardrail</text><text x="170.0" y="526.0" class="s">no evidence = "I don't know"</text><path d="M300,510 L420,510" fill="none" stroke="#888" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="1090" y="640" width="250" height="80" rx="12" fill="#FFF1D6" stroke="#D98A00" stroke-width="2.5"/><text x="1215.0" y="674.0" class="t">8. Approval</text><text x="1215.0" y="696.0" class="s">Send to Google? (voice or button)</text><rect x="780" y="650" width="220" height="60" rx="12" fill="#F1F1F1" stroke="#888888" stroke-width="2.5"/><text x="890.0" y="686.0" class="t">Nothing sent</text><path d="M1230,550 L1230,640" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><path d="M1090,680 L1000,680" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="1045" y="670" class="l">no</text><path d="M1130,150 L1450,150 L1450,680 L1340,680" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="1385" y="142" class="l">send_save</text><rect x="40" y="780" width="1520" height="170" rx="16" fill="#F6FBF6" stroke="#2E9E3E" stroke-width="2" stroke-dasharray="10 6"/><text x="1540" y="810" class="g" style="text-anchor:end">9. n8n automation (Google Docs + Gmail)</text><rect x="70" y="830" width="260" height="80" rx="12" fill="#E4F6E4" stroke="#2E9E3E" stroke-width="2.5"/><text x="200.0" y="864.0" class="t">Webhook</text><text x="200.0" y="886.0" class="s">receives title, content, approval</text><rect x="370" y="830" width="260" height="80" rx="12" fill="#E4F6E4" stroke="#2E9E3E" stroke-width="2.5"/><text x="500.0" y="864.0" class="t">Approved?</text><text x="500.0" y="886.0" class="s">second approval check</text><rect x="670" y="830" width="260" height="80" rx="12" fill="#E4F6E4" stroke="#2E9E3E" stroke-width="2.5"/><text x="800.0" y="864.0" class="t">Create Google Doc</text><text x="800.0" y="886.0" class="s">write content</text><rect x="970" y="830" width="260" height="80" rx="12" fill="#E4F6E4" stroke="#2E9E3E" stroke-width="2.5"/><text x="1100.0" y="864.0" class="t">Send Gmail</text><text x="1100.0" y="886.0" class="s">email the doc to you</text><rect x="1270" y="830" width="260" height="80" rx="12" fill="#E4F6E4" stroke="#2E9E3E" stroke-width="2.5"/><text x="1400.0" y="864.0" class="t">Respond</text><text x="1400.0" y="886.0" class="s">status + doc URL</text><path d="M330,870 L370,870" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><path d="M630,870 L670,870" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><path d="M930,870 L970,870" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><path d="M1230,870 L1270,870" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><path d="M1215,720 L1215,758 L200,758 L200,830" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a)"/><text x="700" y="750" class="l">yes: HTTP POST to webhook</text><text x="1540" y="940" class="l" style="text-anchor:end">not approved / error: n8n returns an error message</text><rect x="40" y="978" width="22" height="22" rx="5" fill="#E6F0FF" stroke="#2F6FD6" stroke-width="2"/><text x="70" y="995" class="lg">Input / output</text><rect x="246" y="978" width="22" height="22" rx="5" fill="#EFE8FF" stroke="#6B46D6" stroke-width="2"/><text x="276" y="995" class="lg">AI agent (Groq gpt-oss-120b)</text><rect x="578" y="978" width="22" height="22" rx="5" fill="#E2F6F1" stroke="#12917A" stroke-width="2"/><text x="608" y="995" class="lg">Data / tools</text><rect x="766" y="978" width="22" height="22" rx="5" fill="#FFF1D6" stroke="#D98A00" stroke-width="2"/><text x="796" y="995" class="lg">Human approval</text><rect x="972" y="978" width="22" height="22" rx="5" fill="#E4F6E4" stroke="#2E9E3E" stroke-width="2"/><text x="1002" y="995" class="lg">Automation</text>
</svg>